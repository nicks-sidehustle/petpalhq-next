name: Dead-ASIN Guard

# §8m regression gate for the 2026-07-29 full-corpus ASIN liveness sweep.
# Runs on every PR (see below). This is a redundant, PR-visible check alongside
# the `prebuild` npm-lifecycle hook (package.json) that already runs the full
# validate:content chain — including this same script — on every
# `npm run build` (so it also runs at Vercel deploy time). Belt-and-suspenders
# on purpose: a PR check surfaces the failure inline before merge, the
# prebuild hook catches it on the production build.
#
# push-to-main trigger dropped 2026-09-24 (gates-streamline): it re-ran the
# same script the production build's prebuild already runs on main, and branch
# protection evaluates this required check on the PR head, never on the
# post-merge push.

on:
  pull_request:
    # NO paths filter (removed, ported from SHE PR #479 / c839d18f — see also
    # dormgearhq-next's parallel port): Dead-ASIN guard is a REQUIRED status
    # check under branch protection, and a required check that never reports
    # on a given PR (because paths didn't match) blocks that PR from merging
    # forever — GitHub has no "not applicable" state, just "never ran". A
    # script-only PR touching neither guide content nor the guard payload
    # (e.g. a CI workflow tweak, package.json, an unrelated lib file) hits
    # this trap. `npm run validate:dead-asin-guard` runs the full-corpus
    # check regardless of what changed, so running it unconditionally on
    # pull_request costs a normal-length green run on non-content PRs, not a
    # new gate.
    #
    # CAVEAT (workflow-file-change semantics): for `pull_request` events,
    # GitHub triggers using the workflow file version on the PR's head ref
    # for commits after the PR is opened (confirmed empirically on SHE PR
    # #479: widening this same kind of filter in-PR did cause the widened
    # trigger to fire on that same PR). This port PR itself, though, only
    # touches workflow files — under the OLD filter still in effect when it
    # is opened, its own required checks may not fire either. Land it as (or
    # follow with) a tiny PR that also touches a still-filtered path, or
    # close/reopen after this merges, to get a self-verifying green run.

jobs:
  dead-asin-guard:
    name: Dead-ASIN guard
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dead-ASIN guard
        run: npm run validate:dead-asin-guard
