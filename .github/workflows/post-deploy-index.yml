name: Post-Deploy Search Index Submit

# Fires when Vercel reports a successful production deployment.
# Architecture inherited from SmartHomeExplorer's pipeline (see SHE
# docs/INDEXING_PIPELINE_HANDOFF.md).
#
# Tier 1 — IndexNow direct API (Bing, Yandex, Naver, Seznam, Yep, etc.)
# Tier 2 — Sitemap (handled at build time by Next.js sitemap.ts; no action here)
# Tier 3 — Google Indexing API (200/day quota, guide URLs only)
#
# Required GitHub repo secrets:
#   INDEXNOW_KEY              — must match /public/{key}.txt content
#   GOOGLE_SERVICE_ACCOUNT_JSON — service account JSON; SA must be GSC owner

on:
  deployment_status:

# Serialize same-SHA runs so the debounce check always sees a COMPLETED prior
# run, never a concurrent one (deskgear #43 pattern, audit §2.8 concurrency
# hardening). GitHub's queueing rule: only the most recently queued run per
# group survives — older pending runs are auto-cancelled regardless of
# cancel-in-progress. That is safe HERE only because the changed-set diff is
# deterministic per SHA (any surviving run does identical work); do not build
# anything non-idempotent on the assumption that every event runs.
concurrency:
  group: post-deploy-index-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  detect-and-submit:
    if: >
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
       github.event.deployment.environment == 'production')

    runs-on: ubuntu-latest
    permissions:
      statuses: read
      # WRITE (not read) because the "Comment on commit" step below posts the
      # submission receipt via POST /repos/:repo/commits/:sha/comments, which
      # the commit-comment API scopes under `contents`. With `contents: read`
      # (and this repo's default GITHUB_TOKEN permission also being read) that
      # call returns "Resource not accessible by integration (HTTP 403)" — the
      # recurring "Commit comment failed (non-fatal)" line on all five runs of
      # the 2026-08-12 prose wave, which left the uploaded JSONL artifact as the
      # only receipt of record. Nothing else in this workflow writes repo
      # contents; the checkout is read-only and no step pushes.
      contents: write
      pull-requests: write
      deployments: read   # for previous-production-deploy SHA lookup (diff base)
      actions: read   # debounce check lists this workflow's prior runs

    env:
      DEPLOY_SHA: ${{ github.event.deployment.sha }}
      REPO: ${{ github.repository }}

    steps:
      # fetch-depth: 0 (full history) so the diff base can be the PREVIOUS
      # production deploy SHA, not just the tip's immediate parent. A batch push
      # of N guides fires ONE production deploy (for the tip); diffing tip vs
      # tip~1 only saw the final commit and silently skipped the earlier N-1
      # guides. See the "Detect changed guides" step for base resolution.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0

      # Debounce: skip if same SHA was already processed. actions/cache
      # CANNOT debounce deployment_status runs — the cache service rejects
      # the event outright ("not tied to a branch or tag ref"), so a
      # cache-keyed sentinel never restores OR saves and every duplicate
      # Vercel success event re-submits the same changed-set (deskgear
      # incident 2026-07-28: one guide 7x; fixed there in PR #43, c809c6d).
      # Marker of record instead: a prior COMPLETED successful run of this
      # workflow for the same SHA. The diff step is deterministic per SHA,
      # so "a run completed successfully" == "this SHA was already handled"
      # (submitted, or correctly found nothing to submit). The concurrency
      # group above guarantees prior runs are complete, not in-flight, when
      # we check.
      - name: Debounce check
        id: debounce
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if PRIOR=$(gh api "repos/${REPO}/actions/workflows/post-deploy-index.yml/runs?head_sha=${DEPLOY_SHA}&status=success&per_page=100" \
              --jq '.workflow_runs | length' 2>/tmp/debounce-err.txt); then
            if [ "${PRIOR:-0}" -gt 0 ]; then
              echo "SHA ${DEPLOY_SHA} already handled by ${PRIOR} completed run(s) — debouncing"
              echo "cache-hit=true" >> "$GITHUB_OUTPUT"
            else
              echo "cache-hit=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Fail CLOSED: the violation class this debounce exists to stop is
            # OVER-submission. A missed submission is cheap to recover (next
            # deploy's diff, or a manual re-run); a silent duplicate is the
            # 2026-07-28 deskgear incident again.
            echo "::warning::Debounce API check failed — failing closed (skipping submission). Error: $(head -c 300 /tmp/debounce-err.txt)"
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed guides
        if: steps.debounce.outputs.cache-hit != 'true'
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$DEPLOY_SHA"

          # ── Resolve the diff BASE = previous PRODUCTION deploy SHA ──────────
          # The old behavior used SHA~1 (tip's immediate parent), which only
          # captured the final commit of a batch push and silently skipped the
          # earlier N-1 guides shipped in the same push (one push → one prod
          # deploy → one deployment_status event). Resolve a wider, correct base:
          #   1) the previous production deployment SHA — see
          #      scripts/search-index/resolve-diff-base.sh for the full rule
          #   2) else SHA~1 (original behavior — last resort)
          #
          # The rule in short: the newest successful production deployment whose
          # SHA is a GIT ANCESTOR of ${SHA}, ordered by git topology rather than
          # by deployment id. Deployment-id order is CREATION order and diverges
          # from ancestor order the moment a deploy fails and recovers, which on
          # 2026-08-12 rewound SHE's baseline one commit past the git parent and
          # re-submitted 5 already-submitted URLs (smarthome-explorer-blog#551).
          # This repo carried the same selector and was MORE exposed: it had no
          # `id < DEPLOY_ID` guard, so a later-created deployment for a
          # DESCENDANT commit could have become the base. That guard now lives in
          # the shared script (DEPLOY_ID below) behind the ancestry check.
          # SUCCESS-ONLY (ported 2026-07-30, oneclickai incident) is preserved
          # inside the script: a FAILED deploy is skipped and the walk continues
          # to the next-newest ancestor, so the failed deploy's URLs are still
          # covered by the next successful run.
          #
          # REMOVED 2026-08-12 — the ledger branch that used to sit first here
          # ("last-indexed SHA" from .pipeline-state/index-submission-log.jsonl).
          # It was dead code that read as a working fallback: this workflow only
          # ever WRITES that file inside the runner and uploads it as an
          # artifact; it is not tracked in the repo (`git ls-files
          # .pipeline-state/` is empty), so the checkout never contains it and
          # the `[ -f "$LEDGER" ]` test was false on every run. Reviving it would
          # mean committing to main from this workflow, which would trigger
          # another production deploy and another run of this workflow — a
          # deploy loop. Deliberately not doing that; the deployments API is the
          # base resolver, with SHA~1 behind it.
          PREV=""
          if [ ! -f scripts/search-index/resolve-diff-base.sh ]; then
            # Only reachable when a commit from BEFORE this script landed is
            # (re)deployed — the checkout is at the deployed SHA.
            echo "::warning::scripts/search-index/resolve-diff-base.sh is absent at ${SHA} (pre-fix commit being redeployed) — using the tip~1 fallback."
          elif RESOLVED=$(DEPLOY_SHA="$SHA" DEPLOY_ID="${{ github.event.deployment.id }}" \
              DEPLOY_ENVS="Production production" GH_REPO="${REPO}" \
              bash scripts/search-index/resolve-diff-base.sh); then
            PREV="$RESOLVED"
          fi

          if [ -z "$PREV" ]; then
            PREV=$(git rev-parse "${SHA}~1" 2>/dev/null || true)
            echo "Diff base fallback (tip~1): $PREV"
          fi

          if [ -z "$PREV" ]; then
            echo "No diff base resolvable - skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sanity cap: don't diff the whole corpus on a stale base. The explicit
          # per-slug ship submit (scripts/search-index/submit-urls.cjs) is the
          # primary path; this workflow is only the safety net.
          RANGE_COUNT=$(git rev-list --count "${PREV}..${SHA}" 2>/dev/null || echo 0)
          if [ "$RANGE_COUNT" -gt 50 ]; then
            echo "::warning::Diff range ${PREV}..${SHA} is ${RANGE_COUNT} commits (>50) — capping base to tip~1 to avoid corpus-wide re-submit."
            PREV=$(git rev-parse "${SHA}~1" 2>/dev/null || echo "$PREV")
          fi

          CHANGED=$(git diff --name-status "${PREV}" "${SHA}" \
            -- 'src/content/guides/*.md' \
              'src/app/page.tsx' \
              'src/app/guides/page.tsx' \
              'src/app/scores/page.tsx' \
              'src/app/deals/page.tsx' \
              'src/app/methodology/page.tsx' 2>/dev/null || true)

          # NOTE (audit §2.8 fix-round, dead-code fix H1): the "narrow-CHANGED
          # empty → skip=true; exit 0" check used to sit HERE, before the
          # broad coverage-gap scan further down ever ran — making the
          # detector unreachable in exactly the scenario it exists to catch.
          # Deferred to after both the narrow mapping loop and the broad
          # notice loop below have run.

          BASE_URL="https://petpalhq.com"
          : > /tmp/all-urls.txt
          : > /tmp/guide-urls.txt
          : > /tmp/mapped-source-files.txt

          # Audit §2.8 fix — route-type coverage. This pathspec/case block
          # used to watch ONLY src/content/guides/*.md, so any other route
          # type (homepage, /guides|/scores|/deals hubs, /methodology) that
          # changed was silently never submitted to Bing. Each arm below
          # maps ONE SPECIFIC route file to ONE SPECIFIC URL (never a
          # blanket "a deploy happened" rule). NOTE: /reviews is a permanent
          # redirect to /guides on this repo (src/app/reviews/page.tsx), not
          # a real content page — no URL is mapped for it. consensus-data.ts
          # backs individual /reviews/[category]/[slug] product pages only
          # (no hub page renders it as an index, unlike sister sites); this
          # repo has no per-slug diff derivation script, so consensus-data.ts
          # changes are surfaced via the coverage-gap notice below rather
          # than mapped to a URL — see the PR body "unmapped" section.
          # Shared layout/globals/component files are deliberately NOT
          # mapped here either (see the coverage-gap detector further down).
          while IFS=$'\t' read -r STATUS FILE; do
            [ -z "$FILE" ] && continue
            case "$FILE" in
              src/content/guides/*.md)
                SLUG=$(basename "$FILE" .md)
                URL="${BASE_URL}/guides/${SLUG}"
                echo "$URL" >> /tmp/all-urls.txt
                echo "$URL" >> /tmp/guide-urls.txt
                echo "  guide: $URL  [$STATUS]"
                echo "$FILE" >> /tmp/mapped-source-files.txt
                ;;
              src/app/page.tsx)
                URL="${BASE_URL}/"
                echo "$URL" >> /tmp/all-urls.txt
                echo "  homepage: $URL  [$STATUS]"
                echo "$FILE" >> /tmp/mapped-source-files.txt
                ;;
              src/app/guides/page.tsx)
                URL="${BASE_URL}/guides"
                echo "$URL" >> /tmp/all-urls.txt
                echo "  guides-hub: $URL  [$STATUS]"
                echo "$FILE" >> /tmp/mapped-source-files.txt
                ;;
              src/app/scores/page.tsx)
                URL="${BASE_URL}/scores"
                echo "$URL" >> /tmp/all-urls.txt
                echo "  scores-hub: $URL  [$STATUS]"
                echo "$FILE" >> /tmp/mapped-source-files.txt
                ;;
              src/app/deals/page.tsx)
                URL="${BASE_URL}/deals"
                echo "$URL" >> /tmp/all-urls.txt
                echo "  deals-hub: $URL  [$STATUS]"
                echo "$FILE" >> /tmp/mapped-source-files.txt
                ;;
              src/app/methodology/page.tsx)
                URL="${BASE_URL}/methodology"
                echo "$URL" >> /tmp/all-urls.txt
                echo "  methodology: $URL  [$STATUS]"
                echo "$FILE" >> /tmp/mapped-source-files.txt
                ;;
            esac
          done <<< "$CHANGED"

          # Coverage-gap detector (audit §2.8 core fix): the CHANGED set
          # above is scoped to an explicit pathspec allowlist. A route TYPE
          # added later (a new page.tsx, a new registry) never enters that
          # allowlist and would otherwise silently never be submitted —
          # exactly the bug class this fix closes. Re-diff broadly over
          # actual route entry points (page.tsx / route.ts under src/app)
          # and known content-registry files; anything that changed there
          # but wasn't explicitly mapped above is surfaced as a build-log
          # ::notice:: (never a failure, never auto-submitted). Shared
          # layout/template/error/loading/global-css files are excluded on
          # purpose — mapping those to a URL would mean "every page changed"
          # on every layout tweak, the full-corpus-churn failure mode this
          # fix must not reintroduce.
          BROAD_CHANGED=$(git diff --name-status "${PREV}" "${SHA}" \
            -- ':(glob)src/app/**/page.tsx' ':(glob)src/app/**/route.ts' \
              'src/lib/content/*' \
            2>/dev/null || true)

          while IFS=$'\t' read -r STATUS FILE; do
            [ -z "$FILE" ] && continue
            case "$FILE" in
              */layout.tsx | */template.tsx | */loading.tsx | */error.tsx | */not-found.tsx | */global-error.tsx)
                continue
                ;;
            esac
            if ! grep -qxF "$FILE" /tmp/mapped-source-files.txt 2>/dev/null; then
              echo "::notice::Unmapped-but-possibly-visible change (not auto-submitted): $FILE  [$STATUS] — verify whether this affects a live URL and submit manually if so."
            fi
          done <<< "$BROAD_CHANGED"

          # Deferred early exit (audit §2.8 fix-round, H1): now that both the
          # narrow mapping loop AND the broad coverage-gap notice loop above
          # have run unconditionally, it's safe to skip submission when the
          # narrow-pathspec CHANGED set was empty — any notice it deserved
          # has already been printed.
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          GUIDE_COUNT=$(wc -l < /tmp/guide-urls.txt | tr -d ' ')
          ALL_COUNT=$(wc -l < /tmp/all-urls.txt | tr -d ' ')
          echo "guide_count=$GUIDE_COUNT" >> "$GITHUB_OUTPUT"
          echo "all_count=$ALL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Verify URL liveness
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true'
        id: verify
        run: |
          sort -u /tmp/all-urls.txt -o /tmp/all-urls.txt
          sort -u /tmp/guide-urls.txt -o /tmp/guide-urls.txt

          TOTAL=$(wc -l < /tmp/all-urls.txt | tr -d ' ')
          if [ "$TOTAL" -eq 0 ]; then
            echo "has_urls=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : > /tmp/all-urls-live.txt
          : > /tmp/guide-urls-live.txt
          SUBMITTED=0
          DROPPED=0

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -L "$URL" 2>/dev/null || echo "000")
            case "$HTTP" in
              200|301|302|307|308)
                echo "  ok $HTTP  $URL"
                echo "$URL" >> /tmp/all-urls-live.txt
                if grep -qx "$URL" /tmp/guide-urls.txt; then
                  echo "$URL" >> /tmp/guide-urls-live.txt
                fi
                SUBMITTED=$((SUBMITTED + 1))
                ;;
              *)
                echo "  drop $HTTP  $URL"
                DROPPED=$((DROPPED + 1))
                ;;
            esac
          done < /tmp/all-urls.txt

          mv /tmp/all-urls-live.txt /tmp/all-urls.txt
          mv /tmp/guide-urls-live.txt /tmp/guide-urls.txt

          echo "Submitted: $SUBMITTED, Dropped: $DROPPED"

          if [ "$SUBMITTED" -eq 0 ]; then
            echo "::warning::All ${TOTAL} URLs failed liveness check"
            echo "has_urls=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_urls=true" >> "$GITHUB_OUTPUT"
          echo "total=$SUBMITTED" >> "$GITHUB_OUTPUT"

      # Anti-burst jitter (owner directive 2026-07-29): a deliberate, deterministic
      # delay before the first search-index submission call. Derived from the deploy
      # SHA + repo name so it differs per site and per deploy, but is reproducible for
      # debugging. This is NOT lag — do not "fix" it by removing/shortening the sleep.
      # Rationale: fixed-offset, machine-regular submission timing across the whole
      # portfolio is a spam-flag signal; staggering submission timing mitigates it.
      - name: Anti-burst jitter (deterministic delay before search-index submission)
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true' &&
          steps.verify.outputs.has_urls == 'true'
        run: |
          SHA="$DEPLOY_SHA"
          HEX=$(printf '%s' "${SHA}${{ github.repository }}" | sha256sum | cut -c1-4)
          DELAY=$(( 16#$HEX % 480 + 90 ))
          echo "Anti-burst jitter: sleeping ${DELAY}s (deterministic from SHA+repo — deliberate anti-burst delay, not lag)"
          sleep "$DELAY"

      - name: Submit to IndexNow
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true' &&
          steps.verify.outputs.has_urls == 'true'
        id: indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY secret not set - skipping IndexNow"
            echo "http_code=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON_URLS=$(jq -R . /tmp/all-urls.txt | jq -sc '.')
          PAYLOAD=$(jq -nc \
            --arg host "petpalhq.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLoc "https://petpalhq.com/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$JSON_URLS" \
            '{host:$host, key:$key, keyLocation:$keyLoc, urlList:$urlList}')

          HTTP_CODE=$(curl -s -o /tmp/indexnow-resp.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "000")

          echo "IndexNow HTTP: $HTTP_CODE"
          cat /tmp/indexnow-resp.txt 2>/dev/null || true

          if echo "$HTTP_CODE" | grep -qE '^(429|5[0-9][0-9])$'; then
            echo "Transient error - retrying after 5s..."
            sleep 5
            HTTP_CODE=$(curl -s -o /tmp/indexnow-resp.txt -w "%{http_code}" \
              -X POST "https://api.indexnow.org/IndexNow" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" || echo "000")
            echo "IndexNow retry HTTP: $HTTP_CODE"
          fi

          echo "http_code=${HTTP_CODE:-000}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Setup Node.js
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true' &&
          steps.diff.outputs.guide_count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true' &&
          steps.diff.outputs.guide_count != '0'
        run: npm ci --ignore-scripts

      # Second, smaller anti-burst gap between the two search-index submission
      # engines (same rationale as above — deliberate, not lag).
      - name: Anti-burst jitter (gap before second submission engine)
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true' &&
          steps.diff.outputs.guide_count != '0'
        run: |
          SHA="$DEPLOY_SHA"
          HEX2=$(printf '%s' "${SHA}${{ github.repository }}-gap2" | sha256sum | cut -c1-4)
          DELAY2=$(( 16#$HEX2 % 90 + 30 ))
          echo "Anti-burst jitter: sleeping ${DELAY2}s before second-engine submission (deterministic — deliberate, not lag)"
          sleep "$DELAY2"

      - name: Submit to Google Indexing API
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true' &&
          steps.diff.outputs.guide_count != '0'
        id: google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON not set - skipping"
            echo "submitted=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/sa-key.json

          # Single --file invocation: one OAuth token for the whole batch. The old
          # per-URL loop re-authenticated for every URL and Google's token endpoint
          # dropped the rapid repeats ("Premature close") — 1 OK then all-FAIL per run.
          RESULT=$(GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json \
            npx tsx scripts/google-index-submit.ts --file /tmp/guide-urls.txt 2>&1 || true)
          echo "$RESULT"

          SUCCESS=$(echo "$RESULT" | grep -oE 'Submitted: [0-9]+' | grep -oE '[0-9]+' | head -1)
          FAILED=$(echo "$RESULT" | grep -oE 'Failed: [0-9]+' | grep -oE '[0-9]+' | head -1)

          rm -f /tmp/sa-key.json
          echo "submitted=${SUCCESS:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED:-0}" >> "$GITHUB_OUTPUT"
          echo "Google API: ${SUCCESS:-0} submitted, ${FAILED:-0} failed"
          exit 0

      # The JSONL below lives ONLY in the runner and only as the uploaded
      # artifact — .pipeline-state/ is not tracked in this repo and this
      # workflow deliberately does not commit it (that would trigger another
      # production deploy, hence another run of this workflow). Do not write a
      # code path that reads it back from the checkout: it will never be there.
      - name: Log submission
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true'
        env:
          TOTAL: ${{ steps.verify.outputs.total }}
          G_SUBMITTED: ${{ steps.google.outputs.submitted }}
          G_FAILED: ${{ steps.google.outputs.failed }}
          INDEXNOW_CODE: ${{ steps.indexnow.outputs.http_code }}
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LOG_ENTRY=$(jq -cn \
            --arg ts "$TS" \
            --arg sha "$DEPLOY_SHA" \
            --argjson total "${TOTAL:-0}" \
            --arg indexnow_http "${INDEXNOW_CODE:-skipped}" \
            --argjson google_submitted "${G_SUBMITTED:-0}" \
            --argjson google_failed "${G_FAILED:-0}" \
            '{timestamp:$ts,sha:$sha,total_urls:$total,indexnow_http:$indexnow_http,google_submitted:$google_submitted,google_failed:$google_failed}')

          echo "=== SUBMISSION SUMMARY ==="
          echo "$LOG_ENTRY"
          echo "=== SUBMITTED URLs ==="
          cat /tmp/all-urls.txt 2>/dev/null || echo "(none)"
          mkdir -p .pipeline-state
          echo "$LOG_ENTRY" >> .pipeline-state/index-submission-log.jsonl

      - name: Upload submission log
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: index-submission-log-${{ github.event.deployment.sha }}
          path: .pipeline-state/index-submission-log.jsonl
          retention-days: 90

      - name: Comment on commit
        if: |
          steps.debounce.outputs.cache-hit != 'true' &&
          steps.diff.outputs.skip != 'true' &&
          steps.verify.outputs.has_urls == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOTAL: ${{ steps.verify.outputs.total }}
          INDEXNOW_CODE: ${{ steps.indexnow.outputs.http_code }}
          G_SUBMITTED: ${{ steps.google.outputs.submitted }}
        run: |
          case "$INDEXNOW_CODE" in
            200|202) INDEXNOW_RESULT="HTTP ${INDEXNOW_CODE} ok" ;;
            "")      INDEXNOW_RESULT="skipped" ;;
            *)       INDEXNOW_RESULT="HTTP ${INDEXNOW_CODE} (warn)" ;;
          esac

          URL_LIST=$(head -20 /tmp/all-urls.txt 2>/dev/null | sed 's/^/  /')
          REMAINING=$(awk 'NR>20{count++} END{print count+0}' /tmp/all-urls.txt 2>/dev/null || echo 0)
          if [ "$REMAINING" -gt 0 ]; then
            EXTRA="  ...and ${REMAINING} more"
          else
            EXTRA=""
          fi

          BODY="**Post-Deploy Search Index Submit**
          
          | Tier | Channel | Result |
          |------|---------|--------|
          | Tier 1 | IndexNow | ${TOTAL} URLs submitted - ${INDEXNOW_RESULT} |
          | Tier 3 | Google Indexing API | ${G_SUBMITTED:-0} guide URLs submitted |
          
          <details><summary>Submitted URLs</summary>
          
          \`\`\`
          ${URL_LIST}${EXTRA}
          \`\`\`
          </details>"
          
          gh api "repos/${REPO}/commits/${DEPLOY_SHA}/comments" \
            -f body="$BODY" \
            --silent || echo "Commit comment failed (non-fatal)"
