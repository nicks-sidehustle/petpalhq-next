name: Liveness Watchdog

# ALERT-ONLY BY LAW (§8b.10 — watchdog redeploy loops are forbidden on cited
# sites). Converted 2026-07-29 from the armed auto-redeploy version.
# Remediation authority = orchestrator/owner ONLY. This workflow may DETECT
# and REPORT; it must never deploy, redeploy, commit, push, force-push, or
# call a deploy hook. Any change re-adding a deploy-capable step to this file
# should be rejected on sight.
#
# Curls every URL in the production sitemap every 30 min. A URL only escalates
# to a GitHub issue when it fails on TWO CONSECUTIVE scheduled runs; single-run
# 4xx/5xx (and curl's `000` no-response marker) just log an ::warning::.
#
# Why the auto-redeploy was removed:
# The old `Trigger Vercel redeploy on failure` step POSTed to
# VERCEL_DEPLOY_HOOK_URL unconditionally on any nonzero failure count, every
# 30 minutes, with no confirmation gate. The identical mechanism on sister
# sites produced 1,102 (deskgear) and 154 (dormgear) empty force-redeploys,
# and SHE's 18 auto-redeploys were all diagnosed as false positives — see
# affiliate-site-template/programs/2026-07-portfolio-parity/she/
# WATCHDOG-404-DIAGNOSIS-2026-07-16.md. Every sampled failing probe was a
# probe-side connection reset (curl `000`, not a real HTTP status) on
# non-repeating URLs that self-healed on the very next request. The redeploys
# fixed nothing and generated exactly the abnormal deploy churn that precedes
# an AI-grounding cut. This workflow now mirrors SHE's alert-only conversion:
# same detection, retry/de-burst hardening, two-consecutive-run confirmation,
# zero self-remediation.
#
# Detection is unchanged and still valuable as a safety net for real
# regressions (broken slugs, missing static files, sitemap drift) — it now
# reports them to a human instead of self-remediating.

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      sitemap_url:
        description: 'Override sitemap URL (default: production)'
        required: false
        default: 'https://petpalhq.com/sitemap.xml'

jobs:
  liveness-check:
    runs-on: ubuntu-latest
    permissions:
      # issues: write — open/comment/close the watchdog tracking issue.
      issues: write
      # contents: read — no checkout is needed and nothing is ever written
      # back to the repo. contents was already read; the deploy-hook POST that
      # made this workflow deploy-capable was removed 2026-07-29.
      contents: read
      # actions: write — required by actions/cache to save a new cache entry
      # (read-only permission only allows restore).
      actions: write

    steps:
      - name: Restore previous run's failed-URL list
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .watchdog-state/previous-failed.txt
          # Primary key is unique per run so restore always falls through to
          # restore-keys, which prefix-matches the most recently saved entry
          # — a rolling "last run's state" cache without ever overwriting a
          # key in place (cache keys are immutable).
          key: liveness-watchdog-failed-${{ github.run_id }}
          restore-keys: |
            liveness-watchdog-failed-

      - name: Fetch sitemap and parse URLs
        id: extract
        env:
          SITEMAP_URL: ${{ inputs.sitemap_url || 'https://petpalhq.com/sitemap.xml' }}
        run: |
          echo "Fetching $SITEMAP_URL"
          curl -sL --max-time 20 "$SITEMAP_URL" -o /tmp/sitemap.xml \
            || { echo "::error::sitemap fetch failed"; exit 1; }

          grep -oE '<loc>[^<]+</loc>' /tmp/sitemap.xml \
            | sed -E 's|</?loc>||g' \
            > /tmp/urls.txt

          URL_COUNT=$(wc -l < /tmp/urls.txt | tr -d ' ')
          echo "url_count=$URL_COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered $URL_COUNT URLs in sitemap"

          if [ "$URL_COUNT" -lt 1 ]; then
            echo "::error::sitemap returned 0 URLs - sitemap broken or unreachable"
            exit 1
          fi

      - name: Curl every URL, collect failures
        id: probe
        run: |
          mkdir -p /tmp/results .watchdog-state
          : > /tmp/results/failures.txt
          : > /tmp/results/failed-urls.txt

          PREV_FILE=".watchdog-state/previous-failed.txt"
          [ -f "$PREV_FILE" ] || : > "$PREV_FILE"

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            # Retry transient connection failures before counting a URL as
            # down — single-attempt failures are near-instant curl connection
            # resets that self-heal on the very next request. A short retry
            # absorbs that noise without masking a real, persistent outage.
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              -A "PetPalHQ-Watchdog/1.0 (+https://petpalhq.com)" \
              "$url" || echo "000")
            if [ "$STATUS" -ge 400 ]; then
              echo "$STATUS $url" >> /tmp/results/failures.txt
              echo "$url" >> /tmp/results/failed-urls.txt
            fi
            # De-burst: avoid hammering a single edge IP with back-to-back
            # fresh TLS connections.
            sleep 0.15
          done < /tmp/urls.txt

          FAILURE_COUNT=$(wc -l < /tmp/results/failures.txt | tr -d ' ')
          echo "failure_count=$FAILURE_COUNT" >> "$GITHUB_OUTPUT"

          # Second-confirmation gate: only treat a URL as a real outage if it
          # ALSO failed in the previous scheduled run (persisted via
          # actions/cache above). Non-repeating single-run failures are
          # suppressed — that gate alone would have prevented every
          # false-positive redeploy observed across the portfolio.
          : > /tmp/results/repeat-urls.txt
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            if grep -Fxq "$url" "$PREV_FILE"; then
              echo "$url" >> /tmp/results/repeat-urls.txt
            fi
          done < /tmp/results/failed-urls.txt

          REPEAT_COUNT=$(wc -l < /tmp/results/repeat-urls.txt | tr -d ' ')
          echo "repeat_count=$REPEAT_COUNT" >> "$GITHUB_OUTPUT"

          # Always record this run's failures for the next run's comparison,
          # regardless of whether they repeat or escalate this time.
          cp /tmp/results/failed-urls.txt "$PREV_FILE"

          if [ "$FAILURE_COUNT" -gt 0 ]; then
            echo "::warning::$FAILURE_COUNT URL(s) returned 4xx/5xx this run"
            echo "--- failures ---"
            cat /tmp/results/failures.txt
            if [ "$REPEAT_COUNT" -gt 0 ]; then
              echo "::warning::$REPEAT_COUNT URL(s) failed on TWO consecutive scheduled runs - escalating"
              cat /tmp/results/repeat-urls.txt
            else
              echo "::warning::No URL repeated from the previous run - most likely transient probe-side connection noise, not escalating."
            fi
          else
            echo "All URLs returned 2xx/3xx"
          fi

      - name: Save this run's failed-URL list for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watchdog-state/previous-failed.txt
          key: liveness-watchdog-failed-${{ github.run_id }}

      - name: Open or update tracking issue (alert-only, no redeploy)
        if: steps.probe.outputs.repeat_count != '0'
        uses: actions/github-script@v8
        env:
          FAILURE_COUNT: ${{ steps.probe.outputs.failure_count }}
          REPEAT_COUNT: ${{ steps.probe.outputs.repeat_count }}
          URL_COUNT: ${{ steps.extract.outputs.url_count }}
        with:
          script: |
            const fs = require('fs');
            const failures = fs.readFileSync('/tmp/results/failures.txt', 'utf8').trim();
            const repeats = fs.readFileSync('/tmp/results/repeat-urls.txt', 'utf8').trim();
            const failureCount = process.env.FAILURE_COUNT;
            const repeatCount = process.env.REPEAT_COUNT;
            const urlCount = process.env.URL_COUNT;

            const title = `Liveness watchdog: ${repeatCount} URL(s) failing on consecutive runs`;
            const body = [
              `**Watchdog detected ${repeatCount} URL(s) failing on TWO CONSECUTIVE scheduled runs.**`,
              '',
              '```',
              repeats,
              '```',
              '',
              `All ${failureCount} of ${urlCount} URL(s) that returned 4xx/5xx this run:`,
              '',
              '```',
              failures,
              '```',
              '',
              'This is alert-only - no redeploy is triggered (alert-only by law, converted 2026-07-29). Single-run failures are usually transient probe-side connection noise (curl `000` is a connection reset, not an HTTP status) that self-heals on the next request, which is why this issue only fires once the SAME URL fails twice in a row. Verify the URL is actually down before acting; remediation is an orchestrator/owner decision, never an automated one.',
              '',
              `_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'watchdog',
              state: 'open',
              per_page: 5,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              console.log(`Commented on existing issue #${issues[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['watchdog'],
              });
              console.log('Opened new watchdog issue');
            }

      - name: Close stale watchdog issues if all green
        if: steps.probe.outputs.failure_count == '0'
        uses: actions/github-script@v8
        env:
          URL_COUNT: ${{ steps.extract.outputs.url_count }}
        with:
          script: |
            const urlCount = process.env.URL_COUNT;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'watchdog',
              state: 'open',
              per_page: 5,
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `All ${urlCount} URLs returning 2xx/3xx - closing.\n\n_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed stale watchdog issue #${issue.number}`);
            }
